<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scart Sushi | Sistema de Gestión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="app">

        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside class="sidebar">

            <div class="brand">
                <div class="brand-logo">🍣</div>

                <div class="brand-text">
                    <h1>Scart Sushi</h1>
                    <span>Sistema de Gestión</span>
                </div>
            </div>

            <nav class="sidebar-nav">

                <button class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">▦</span>
                    <span>Dashboard</span>
                </button>

                <button class="nav-item nav-primary" data-page="nuevo-pedido">
                    <span class="nav-icon">＋</span>
                    <span>Nuevo Pedido</span>
                </button>

                <button class="nav-item" data-page="pedidos">
                    <span class="nav-icon">▤</span>
                    <span>Pedidos</span>
                </button>

                <button class="nav-item" data-page="mesas">
                    <span class="nav-icon">▣</span>
                    <span>Mesas</span>
                </button>

                <button class="nav-item" data-page="ventas">
                    <span class="nav-icon">$</span>
                    <span>Ventas</span>
                </button>

                <button class="nav-item" data-page="inventario">
                    <span class="nav-icon">▧</span>
                    <span>Inventario</span>
                </button>

                <button class="nav-item" data-page="menu">
                    <span class="nav-icon">☰</span>
                    <span>Menú / Productos</span>
                </button>

            </nav>

            <div class="sidebar-footer">

                <button class="nav-item" data-page="configuracion">
                    <span class="nav-icon">⚙</span>
                    <span>Configuración</span>
                </button>

                <div class="restaurant-status">
                    <span class="status-dot"></span>

                    <div>
                        <strong>Local operativo</strong>
                        <small>10:00 - 00:00</small>
                    </div>
                </div>

            </div>

        </aside>


        <!-- =====================================================
             CONTENIDO PRINCIPAL
        ====================================================== -->

        <main class="main">

            <!-- HEADER -->

            <header class="topbar">

                <div class="topbar-title">
                    <h2 id="page-title">Dashboard</h2>
                    <p id="page-description">
                        Resumen general de la operación
                    </p>
                </div>


                <div class="topbar-actions">

                    <!-- Reloj en tiempo real -->

                    <div class="clock">
                        <span class="clock-icon">◷</span>

                        <div>
                            <span id="current-date">--</span>
                            <strong id="current-time">--:--:--</strong>
                        </div>
                    </div>


                    <!-- Usuario -->

                    <div class="user">
                        <div class="user-avatar">
                            AD
                        </div>

                        <div class="user-info">
                            <strong>Administrador</strong>
                            <span>Scart Sushi</span>
                        </div>
                    </div>

                </div>

            </header>


            <!-- =================================================
                 CONTENEDOR DINÁMICO

                 Aquí JavaScript irá cargando:
                 Dashboard
                 Nuevo Pedido
                 Pedidos
                 Mesas
                 Ventas
                 Inventario
                 Menú
            ================================================== -->

            <section id="app-content" class="content">

                <!-- Pantalla temporal inicial -->

                <div class="welcome-card">

                    <div class="welcome-icon">
                        🍣
                    </div>

                    <h2>Scart Sushi</h2>

                    <p>
                        Sistema de gestión de pedidos, mesas,
                        ventas e inventario.
                    </p>

                    <button
                        class="btn btn-primary"
                        data-go="nuevo-pedido"
                    >
                        ＋ Crear nuevo pedido
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- =====================================================
         CONTENEDOR DE NOTIFICACIONES
    ====================================================== -->

    <div id="toast-container" class="toast-container"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/data.js"></script>

    <script src="js/pedidos.js"></script>
    <script src="js/mesas.js"></script>
    <script src="js/ventas.js"></script>
    <script src="js/inventario.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/nuevo-pedido.js"></script>
    
    <!-- app.js siempre al final -->
    <script src="js/app.js"></script>

</body>
</html>
